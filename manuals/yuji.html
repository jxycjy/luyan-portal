<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>路演提报（预计）操作手册（PDF 版）</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.bar{position:sticky;top:0;background:#0f9b8e;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15);flex-wrap:wrap}
.bar .t{font-size:15px;font-weight:600}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.bar a{color:#fff;background:rgba(255,255,255,.18);text-decoration:none;font-size:13px;padding:6px 14px;border-radius:8px;white-space:nowrap}
.bar a:hover{background:rgba(255,255,255,.3)}
.frame{width:100%;height:calc(100vh - 54px);border:0;background:#fff}
.tip{text-align:center;color:#6b7b78;font-size:12px;padding:6px}
</style>
</head>
<body>
<div class="bar"><span class="t" id="mtitle">路演提报（预计）操作手册 · PDF 版</span>
  <span class="acts">
    <a href="javascript:void(0)" class="btn" id="dlbtn">下载 PDF 到本地</a>
    <a href="#" id="openbtn" target="_blank" rel="noopener">新窗口打开</a>
  </span>
</div>
<iframe id="pdf" class="frame" title="路演提报（预计）操作手册"></iframe>
<div class="tip">若上方 PDF 未能加载，请点击右上角「新窗口打开」或「下载 PDF 到本地」。</div>
<script>
const DATA = {"title": "路演提报（预计）操作手册", "pdfUrl": "https://cdn.jsdelivr.net/gh/jxycjy/luyan-portal@master/%E8%B7%AF%E6%BC%94%E6%8F%90%E6%8A%A5%EF%BC%88%E9%A2%84%E8%AE%A1%EF%BC%89%E6%93%8D%E4%BD%9C%E6%89%8B%E5%86%8C.pdf", "pdfName": "路演提报（预计）操作手册.pdf"};
async function downloadPdf(btn, url, filename){
  const orig = btn.textContent;
  btn.textContent = '下载中...';
  btn.style.opacity = '0.7';
  btn.style.pointerEvents = 'none';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
    btn.textContent = '下载完成';
  } catch (e) {
    console.error(e);
    btn.textContent = '下载失败，跳转打开...';
    setTimeout(() => window.open(url, '_blank'), 800);
  }
  setTimeout(() => { btn.textContent = orig; btn.style.opacity = '1'; btn.style.pointerEvents = ''; }, 2500);
}
(function(){
  const d = DATA;
  document.getElementById('mtitle').textContent = d.title + ' · PDF 版';
  const frame = document.getElementById('pdf');
  frame.src = d.pdfUrl;
  document.getElementById('openbtn').href = d.pdfUrl;
  const bar = document.getElementById('dlbtn');
  bar.onclick = function(){ downloadPdf(bar, d.pdfUrl, d.pdfName); };
})();
</script>
</body></html>
