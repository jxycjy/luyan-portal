<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路演提报系统—区域经理端</title>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
  :root{
    --teal:#0f9b8e; --teal-d:#0c7d72; --bg:#f3f7f7;
    --sidebar:#ffffff; --ink:#1f2d2b; --gray:#6b7b78; --line:#e4eeec;
    --hover:#e9f7f5; --active:#d8f0ec; --sub-bg:#f8fbfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .app{display:flex;height:100vh;width:100vw}
  .sidebar{width:320px;min-width:320px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:4px 0 18px rgba(15,155,142,.08)}
  .sidebar-header{padding:20px 18px 16px;border-bottom:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff}
  .sidebar-header h1{font-size:18px;font-weight:600;letter-spacing:1px}
  .sidebar-header p{font-size:12px;opacity:.9;margin-top:4px}
  .nav-title{padding:12px 18px 6px;font-size:13px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:1px}
  .group{margin-bottom:6px}
  .group-label{padding:10px 18px 4px;font-size:13px;color:var(--teal-d);font-weight:700;display:flex;align-items:center;gap:8px}
  .group-label::before{content:"";display:inline-block;width:4px;height:14px;background:var(--teal);border-radius:2px}
  .nav-item{display:flex;align-items:flex-start;gap:8px;padding:11px 18px 11px 26px;cursor:pointer;transition:background .15s;color:var(--ink);border-left:3px solid transparent}
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{background:var(--active);border-left-color:var(--teal-d)}
  .nav-item .num{min-width:30px;text-align:right;font-size:13px;color:var(--teal-d);font-weight:700;flex-shrink:0}
  .nav-item .text{font-size:14px;line-height:1.5}
  .nav-item.active .text{color:var(--teal-d);font-weight:600}
  .sub-group{margin:2px 0;background:var(--sub-bg);border-radius:8px;margin:0 8px 4px}
  .sub-label{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px;cursor:pointer;transition:background .15s;border-radius:8px;color:var(--ink)}
  .sub-label:hover{background:var(--hover)}
  .sub-label .left{display:flex;align-items:flex-start;gap:8px}
  .sub-label .num{min-width:30px;text-align:right;font-size:13px;color:var(--teal-d);font-weight:700;flex-shrink:0}
  .sub-label .text{font-size:14px;font-weight:600;line-height:1.5}
  .sub-label .arrow{width:16px;height:16px;transition:transform .2s;color:var(--gray);flex-shrink:0}
  .sub-label .arrow.rotated{transform:rotate(-90deg)}
  .sub-items{display:block}
  .sub-items.collapsed{display:none}
  .sub-item{display:flex;align-items:flex-start;gap:8px;padding:9px 12px 9px 24px;margin-left:18px;cursor:pointer;transition:background .15s;color:var(--ink);border-left:3px solid transparent}
  .sub-item:hover{background:var(--hover)}
  .sub-item.active{background:var(--active);border-left-color:var(--teal-d)}
  .sub-item .num{min-width:36px;text-align:right;font-size:12px;color:var(--teal-d);font-weight:700;flex-shrink:0}
  .sub-item .text{font-size:13px;line-height:1.5}
  .sub-item.active .text{color:var(--teal-d);font-weight:600}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  .main-header{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;flex-shrink:0}
  .main-header .left{display:flex;align-items:center;gap:12px;min-width:0}
  .main-header .label{background:#e6f6f3;color:var(--teal-d);font-size:12px;padding:3px 10px;border-radius:12px;flex-shrink:0}
  .main-header h2{font-size:17px;color:var(--teal-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main-header .right{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:13px;transition:background .18s;flex-shrink:0}
  .btn:hover{background:var(--teal-d)}
  .btn svg{width:14px;height:14px;fill:currentColor}
  .mobile-toggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;margin-right:10px}
  .content{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
  .tip-bar{background:#fff8e6;color:#8a6d3b;font-size:12px;padding:8px 16px;border-bottom:1px solid #f0e4c6;display:flex;align-items:center;gap:8px}
  iframe{flex:1;width:100%;border:none;background:#fff}
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--bg)}
  .welcome .big-ico{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--teal),var(--teal-d));display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;box-shadow:0 10px 28px rgba(15,155,142,.28);margin-bottom:20px}
  .welcome h3{font-size:24px;color:var(--teal-d);margin-bottom:10px}
  .welcome p{color:var(--gray);font-size:15px;max-width:460px;line-height:1.7}
  .welcome .quick{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .welcome .quick span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--ink)}
  @media (max-width:768px){
    .sidebar{position:fixed;left:-320px;top:0;bottom:0;z-index:100;transition:left .25s}
    .sidebar.open{left:0}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99}
    .overlay.show{display:block}
    .mobile-toggle{display:flex}
    .main-header{padding:0 12px}
  }
  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f9b8e,#0c7d72);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
  #gate .card{background:#fff;border-radius:16px;padding:36px 32px;width:340px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
  #gate .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#0f9b8e,#0c7d72);display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:14px}
  #gate h1{font-size:19px;color:#1f2d2b;margin-bottom:6px}
  #gate p{font-size:13px;color:#6b7b78;margin-bottom:20px}
  #gate input{width:100%;padding:12px 14px;border:1px solid #d7e3e0;border-radius:10px;font-size:15px;outline:none;box-sizing:border-box}
  #gate input:focus{border-color:#0f9b8e}
  #gate button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:10px;background:#0f9b8e;color:#fff;font-size:15px;cursor:pointer;transition:background .18s}
  #gate button:hover{background:#0c7d72}
  #gate .err{color:#c0392b;font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div id="gate"><div class="card">
  <div class="logo">🎯</div>
  <h1>路演提报系统</h1>
  <p>区域经理端 · 请输入访问密码</p>
  <input id="pw" type="password" placeholder="访问密码" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">进入门户</button>
  <div class="err" id="err"></div>
</div></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>路演提报系统—区域经理端</h1>
      <p>操作说明 · 填报表单 · 查询报表</p>
    </div>
    <div class="nav-title">导航 / 目录</div>
    <nav class="nav-scroll" id="navScroll"></nav>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <main class="main">
    <div class="main-header">
      <div class="left">
        <button class="mobile-toggle" onclick="toggleSidebar()" aria-label="打开导航">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f2d2b" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span class="label" id="pageLabel">欢迎</span>
        <h2 id="pageTitle">请选择左侧目录进入对应页面</h2>
      </div>
      <div class="right">
        <a class="btn" id="openBtn" href="#" target="_blank" rel="noopener" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
          新窗口打开
        </a>
      </div>
    </div>
    <div class="content" id="contentArea">
      <div class="welcome">
        <div class="big-ico">🎯</div>
        <h3>路演提报系统 · 区域经理端</h3>
        <p>点击左侧导航目录，即可在同一页面内查看操作手册、填报表单或查询报表。如果右侧内容无法显示，请点击右上角「新窗口打开」。</p>
        <div class="quick">
          <span>📘 3 份操作手册</span>
          <span>📝 2 个填报表单</span>
          <span>📈 8 个查询报表</span>
        </div>
      </div>
    </div>
  </main>
</div>

let menu = null;
const navScroll = document.getElementById('navScroll');
const contentArea = document.getElementById('contentArea');
const pageLabel = document.getElementById('pageLabel');
const pageTitle = document.getElementById('pageTitle');
const openBtn = document.getElementById('openBtn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

function flattenMenu(){
  const list = [];
  menu.forEach((g, gi) => {
    g.items.forEach((it, ii) => {
      if(it.items){
        it.items.forEach((sub, si) => { list.push({...sub, num:`${gi+1}.${ii+1}.${si+1}`}); });
      }else{
        list.push({...it, num:`${gi+1}.${ii+1}`});
      }
    });
  });
  return list;
}
function buildNav(){
  menu.forEach((g, gi) => {
    const group = document.createElement('div');
    group.className = 'group';
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = g.cat;
    group.appendChild(label);
    g.items.forEach((it, ii) => {
      const num = `${gi+1}.${ii+1}`;
      if(it.items){
        const subWrap = document.createElement('div');
        subWrap.className = 'sub-group';
        const subLabel = document.createElement('div');
        subLabel.className = 'sub-label';
        subLabel.innerHTML = `<div class="left"><span class="num">${num}</span><span class="text">${it.sub}</span></div><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`;
        const subList = document.createElement('div');
        subList.className = 'sub-items';
        subList.id = `sub-${it.sub}`;
        it.items.forEach((sub, si) => {
          const subNum = `${num}.${si+1}`;
          const item = document.createElement('div');
          item.className = 'sub-item';
          item.dataset.id = sub.id;
          item.innerHTML = `<span class="num">${subNum}</span><span class="text">${sub.title}</span>`;
          item.onclick = () => openItem(sub.id);
          subList.appendChild(item);
        });
        subLabel.onclick = () => {
          subList.classList.toggle('collapsed');
          subLabel.querySelector('.arrow').classList.toggle('rotated');
        };
        subWrap.appendChild(subLabel);
        subWrap.appendChild(subList);
        group.appendChild(subWrap);
      }else{
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.dataset.id = it.className;
        item.dataset.id = it.id;
        item.innerHTML = `<span class="num">${num}</span><span class="text">${it.title}</span>`;
        item.onclick = () => openItem(it.id);
        group.appendChild(item);
      }
    });
    navScroll.appendChild(group);
  });
}
function findItem(id){ return flattenMenu().find(it => it.id === id); }
function openItem(id){
  activeId = id;
  document.querySelectorAll('.nav-item, .sub-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const item = findItem(id);
  if(!item) return;
  pageLabel.textContent = item.type;
  pageTitle.textContent = item.title;
  openBtn.href = item.url;
  openBtn.style.display = 'inline-flex';
  contentArea.innerHTML = `<div class="tip-bar">⚠️ 若下方页面无法显示，请点击右上角「新窗口打开」。</div><iframe src="${item.url}" title="${item.title}" allowfullscreen></iframe>`;
  if(window.innerWidth <= 768) toggleSidebar(false);
}
let activeId = null;
function toggleSidebar(force){
  const open = force === undefined ? !sidebar.classList.contains('open') : force;
  sidebar.classList.toggle('open', open);
  overlay.classList.toggle('show', open);
}
function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  try {
    const bytes = CryptoJS.AES.decrypt(MENU_CIPHER, pw);
    menu = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
  } catch(e){ menu = null; }
  if(!menu || !Array.isArray(menu)){ err.textContent='密码错误，请重试'; return; }
  err.textContent='';
