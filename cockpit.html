<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 防搜索引擎收录（与门户保持一致） -->
<meta name="robots" content="noindex, nofollow">
<title>领导驾驶舱 · 路演报表与看板门户</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#e3e8ee; --text:#1f2a37; --muted:#6b7785;
    --brand:#007A6E; --brand-soft:#e6f3f1;
    --shadow:0 1px 5px rgba(31,39,51,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}

  /* 顶栏（大气版：加高、加大标题、同色系轻微渐变） */
  .topbar{height:88px;background:linear-gradient(120deg,#00897b,#00695f);color:#fff;
    display:flex;align-items:center;padding:0 32px;gap:18px;position:sticky;top:0;z-index:10;
    box-shadow:0 3px 16px rgba(0,90,80,.20)}
  .brand{display:flex;align-items:center;gap:16px}
  .brand .logo{font-size:36px;line-height:1}
  .brand .t1{font-size:27px;font-weight:800;letter-spacing:4px;line-height:1.15}
  .brand .t2{font-size:13px;opacity:.85;letter-spacing:2px;margin-top:3px}
  .gate-link{margin-left:auto;color:#fff;text-decoration:none;font-size:14px;
    border:1px solid rgba(255,255,255,.55);padding:9px 18px;border-radius:10px;white-space:nowrap;
    transition:.15s}
  .gate-link:hover{background:rgba(255,255,255,.18)}

  /* 布局：左侧目录树 + 右侧内容 */
  .layout{display:flex;min-height:calc(100vh - 88px)}
  .sidebar{width:268px;background:var(--panel);border-right:1px solid var(--line);
    padding:18px 14px;flex-shrink:0;overflow:auto}
  .nav-title{font-size:13px;color:var(--muted);padding:0 8px 12px;letter-spacing:1px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;
    cursor:pointer;font-size:14px;color:#33415a;user-select:none;transition:.12s;margin-bottom:1px;border-radius:8px}
  .nav-item .tw{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item .ar{color:var(--muted);font-size:11px;margin-left:auto;flex-shrink:0}
  .nav-item .num{color:var(--brand);font-weight:600;margin-right:2px;font-variant-numeric:tabular-nums}
  .nav-item.cat{font-weight:700;color:var(--brand);border-left:3px solid var(--brand);
    border-radius:0 8px 8px 0;padding-left:12px;margin-left:6px}
  .nav-item.sub{font-weight:600;color:#2a3a44;padding-left:20px}
  .nav-item.grp{color:var(--muted);padding-left:34px;font-size:13px}
  .nav-item.leaf{color:#3a4654;text-decoration:none;padding-left:30px;font-size:13px}
  .nav-item.leaf:hover{background:var(--brand-soft);color:var(--brand)}
  .nav-item.leaf.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav-item.leaf .ar{color:var(--brand);font-size:12px}
  .nav-item.leaf.todo{color:#b5791a;cursor:not-allowed}
  .nav-item.leaf.todo .ar{display:none}
  .badge{font-size:10px;background:#fff3e0;color:#b5791a;padding:1px 6px;border-radius:5px;margin-left:6px;flex-shrink:0}
  .nav-item:hover{background:var(--brand-soft)}
  .side-foot{margin-top:20px;font-size:12px;color:var(--muted);padding:0 8px;line-height:1.6}

  /* 右侧内容 */
  .main{flex:1;padding:22px 26px;overflow:auto}
  .welcome{max-width:760px;margin:10px auto 0;text-align:center;padding:30px 20px}
  .welcome .big{font-size:54px;margin-bottom:8px}
  .welcome h2{font-size:22px;margin-bottom:8px}
  .welcome p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:22px}
  .stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:16px 22px;min-width:130px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:700;color:var(--brand)}
  .stat .l{font-size:13px;color:var(--muted);margin-top:2px}

  /* 中间 iframe 内容区 */
  .main.framed{padding:16px 18px}
  .frame-bar{display:flex;align-items:center;gap:12px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .frame-bar .fb-t{font-size:15px;font-weight:700;color:var(--text)}
  .frame-bar .fb-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .frame-bar .fb-new{margin-left:auto;color:var(--brand);text-decoration:none;font-size:13px;
    border:1px solid var(--brand);padding:6px 12px;border-radius:8px;white-space:nowrap;transition:.15s}
  .frame-bar .fb-new:hover{background:var(--brand);color:#fff}
  .frame{width:100%;height:calc(100vh - 215px);border:0;background:#fff;border-radius:10px;
    box-shadow:var(--shadow);display:block}
  .frame-tip{max-width:560px;margin:56px auto 0;text-align:center;background:var(--panel);
    border:1px dashed var(--line);border-radius:14px;padding:42px 24px;color:var(--muted)}
  .frame-tip .e{font-size:44px;margin-bottom:10px}
  .frame-tip .t{font-size:16px;color:var(--text);font-weight:600;margin-bottom:6px}

  @media(max-width:760px){
    .layout{flex-direction:column}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:12px}
    .side-foot{display:none}
    .main{padding:16px 14px}
    .topbar{padding:0 16px;height:76px}
    .brand .logo{font-size:30px}
    .brand .t1{font-size:21px;letter-spacing:2px}
    .brand .t2{display:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🚀</span>
    <div>
      <div class="t1">领导驾驶舱</div>
    </div>
  </div>
  <a class="gate-link" href="https://jxycjy.github.io/luyan-portal/" target="_blank">↩ 回到操作门户</a>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-title">导航 / 目录</div>
    <nav id="nav"></nav>
    <div class="side-foot">📌 点击左侧目录中的报表名称，中间即显示对应看板</div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ====== 频道（一级分组） ====== */
const CHANNELS = [
  {key:"运营", name:"运营管理"},
  {key:"客户", name:"客户管理"},
];

/* ====== 报表与看板清单（改这里即可） ======
   num = 左侧显示编号；sec = 可选分组标题（留空则直接挂在一级目录下）
   url:"#" 为占位待填；todo:true 标「待开发」            */
const REPORTS = [
  /* —— 运营管理 —— */
  {cat:"运营", num:"1.1", title:"销售周报看板",           url:"https://saas.yonghongtech.com/s/3evfBa"},
  {cat:"运营", num:"1.2", title:"市场TOC零售渠道扣点看板", url:"https://app75554.eapps.dingtalkcloud.com/decision/shared/0s6bjc79k5tbp"},
  {cat:"运营", num:"1.3", title:"渠道销售数据趋势（TOC）", url:"https://work.jiushuyun.com/decision/shared/0r8rtznye0a6t"},
  {cat:"运营", num:"1.4", title:"已成交客户销货单查询",     url:"https://work.jiushuyun.com/decision/shared/0r4tsnzn965b3"},
  {cat:"运营", num:"1.5", title:"全部客户销货单查询",       url:"https://work.jiushuyun.com/decision/shared/0r56rfxq0xxyk"},

  /* —— 运营管理 · 路演及费用 —— */
  {cat:"运营", num:"2.1", sec:"路演及费用", title:"促销员薪资汇总看板", url:"#", todo:true},
  {cat:"运营", num:"2.2", sec:"路演及费用", title:"渠道费用看板",       url:"#", todo:true},
  {cat:"运营", num:"2.3", sec:"路演及费用", title:"盒马路演分析",       url:"https://work.jiushuyun.com/decision/shared/0rfh99a8jedaf"},
  {cat:"运营", num:"2.4", sec:"路演及费用", title:"永辉路演分析",       url:"https://work.jiushuyun.com/decision/shared/0rfv07xbs1kh4"},
  {cat:"运营", num:"2.5", sec:"路演及费用", title:"小象路演分析",       url:"https://work.jiushuyun.com/decision/shared/0ry9ykjf1n28m"},
  {cat:"运营", num:"2.6", sec:"路演及费用", title:"传统路演分析",       url:"https://work.jiushuyun.com/decision/shared/0ry9xyx5zgb3g"},

  /* —— 客户管理 —— */
  {cat:"客户", num:"3.1", title:"商机分析看板",     url:"https://t8ddwiwj15.jiandaoyun.com/dash/6a2a61cea195efacc5df5725"},
  {cat:"客户", num:"3.2", title:"客户分析看板",     url:"https://t8ddwiwj15.jiandaoyun.com/dash/6a2a61cea195efacc5df5727"},
  {cat:"客户", num:"3.3", title:"商机最新进度查询", url:"https://t8ddwiwj15.jiandaoyun.com/dash/6a2a61cea195efacc5df5752"},
];

/* ====== 左侧目录树（竖向展开） ====== */
const expanded = new Set();
CHANNELS.forEach(c=> expanded.add(c.key));
REPORTS.forEach(r=>{ if(r.sec) expanded.add(r.cat+"|"+r.sec); });
REPORTS.forEach((r,i)=> r.id = i);
let selId = null;

function leafHtml(r){
  if(r.todo){
    return `<div class="nav-item leaf todo"><span class="num">${r.num}</span><span class="tw">${r.title}</span><span class="badge">待开发</span></div>`;
  }
  const active = selId===r.id ? " active" : "";
  return `<div class="nav-item leaf${active}" onclick="openReport(${r.id})"><span class="num">${r.num}</span><span class="tw">${r.title}</span><span class="ar">›</span></div>`;
}

function toggle(key){ if(expanded.has(key)) expanded.delete(key); else expanded.add(key); buildNav(); }

/* 点击目录 → 中间区域用 iframe 内嵌显示对应看板 */
function openReport(id){
  const r = REPORTS[id];
  selId = id;
  buildNav();
  const main = document.getElementById("main");
  main.classList.add("framed");
  if(r.todo){
    main.innerHTML = `<div class="frame-tip"><div class="e">🚧</div>
      <div class="t">${r.num} ${r.title}</div>
      <div>该看板尚未开发，暂不可查看。</div></div>`;
    return;
  }
  main.innerHTML = `<div class="frame-bar">
      <div><div class="fb-t">${r.num} ${r.title}</div>
      <div class="fb-sub">如内嵌受限，可点击右上角在新窗口打开</div></div>
      <a class="fb-new" href="${r.url}" target="_blank" rel="noopener">↗ 新窗口打开</a>
    </div>
    <iframe class="frame" src="${r.url}" referrerpolicy="no-referrer" loading="lazy" allow="fullscreen"></iframe>`;
}

/* 运营管理下：1.1–1.5 直接挂；2.1–2.6 归入「路演及费用」分组（由 sec 控制） */
function buildNav(){
  let html = "";
  CHANNELS.forEach((c)=>{
    const catKey = c.key;
    const catOpen = expanded.has(catKey);
    html += `<div class="nav-item cat ${catOpen?'':'collapsed'}" onclick="toggle('${catKey}')"><span class="tw">${c.name}</span><span class="ar">${catOpen?'▾':'▸'}</span></div>`;
    if(catOpen){
      const groups = [];
      REPORTS.filter(r=>r.cat===catKey).forEach(r=>{
        const sec = r.sec || "";
        let g = groups.find(x=>x.sec===sec);
        if(!g){ g = {sec, items:[]}; groups.push(g); }
        g.items.push(r);
      });
      groups.forEach(g=>{
        if(g.sec){
          const secKey = catKey+"|"+g.sec;
          const secOpen = expanded.has(secKey);
          html += `<div class="nav-item sub ${secOpen?'':'collapsed'}" onclick="toggle('${secKey}')"><span class="tw">${g.sec}</span><span class="ar">${secOpen?'▾':'▸'}</span></div>`;
          if(!secOpen) return;
        }
        g.items.forEach(r=> html += leafHtml(r));
      });
    }
  });
  document.getElementById("nav").innerHTML = html;
}

function welcome(){
  const count = k => REPORTS.filter(r=>r.cat===k).length;
  return `<div class="welcome">
    <div class="big">🚀</div>
    <h2>领导驾驶舱</h2>
    <p>统一报表与看板入口<br>点击左侧目录中的报表名称，中间区域即显示对应看板。</p>
    <div class="stats">
      <div class="stat"><div class="n">${count("运营")}</div><div class="l">📊 运营管理</div></div>
      <div class="stat"><div class="n">${count("客户")}</div><div class="l">👥 客户管理</div></div>
    </div>
  </div>`;
}

buildNav();
const mainEl = document.getElementById("main");
mainEl.classList.remove("framed");
mainEl.innerHTML = welcome();
</script>
</body>
</html>
